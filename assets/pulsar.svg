<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150a14"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ff5eb0"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="beam2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24"
        fill="url(#bg)" stroke="#ff2d95" stroke-width="1.5" stroke-opacity="0.5"/>
  <g filter="url(#glow)">
    <polygon points="64,64 -20,30 -20,50" fill="url(#beam1)"/>
    <polygon points="64,64 148,78 148,98" fill="url(#beam2)"/>
    <ellipse cx="64" cy="64" rx="40" ry="8" fill="none" stroke="#ff2d95" stroke-width="1.5" stroke-opacity="0.5" transform="rotate(-20 64 64)"/>
    <ellipse cx="64" cy="64" rx="40" ry="8" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.4" transform="rotate(25 64 64)"/>
    <circle cx="64" cy="64" r="26" fill="url(#core)" opacity="0.6"/>
    <circle cx="64" cy="64" r="7" fill="#ffffff"/>
  </g>
  <circle cx="100" cy="28" r="1.5" fill="#ff2d95" opacity="0.8"/>
  <circle cx="24" cy="100" r="1.2" fill="#00ff88" opacity="0.6"/>
  <circle cx="20" cy="22" r="1" fill="#ffffff" opacity="0.4"/>
</svg>
